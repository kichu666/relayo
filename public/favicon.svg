<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradient Border -->
    <linearGradient id="relayoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="cyanArrow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Outer Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Gradient Squircle Ring with Glow -->
  <rect x="24" y="24" width="464" height="464" rx="136" fill="url(#relayoBorder)" filter="url(#neonGlow)" />

  <!-- Inner Solid Dark Box -->
  <rect x="42" y="42" width="428" height="428" rx="118" fill="#070A12" />

  <!-- Centered Dual Exchange Arrows (Lucide ArrowLeftRight styled) -->
  <g stroke="url(#cyanArrow)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Arrow (Left-to-Right) -->
    <line x1="144" y1="188" x2="368" y2="188" />
    <polyline points="308,128 368,188 308,248" />

    <!-- Bottom Arrow (Right-to-Left) -->
    <line x1="368" y1="324" x2="144" y2="324" />
    <polyline points="204,264 144,324 204,384" />
  </g>
</svg>